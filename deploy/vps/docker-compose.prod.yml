services:
  meshwiki:
    image: ghcr.io/jyrkihuhta/meshwiki:${MESHWIKI_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - /opt/meshwiki/data/pages:/data/pages
    env_file: /opt/meshwiki/.env
    # The host runs other workloads and can run short of memory. Reserve
    # some and lower the OOM score so the kernel kills other processes
    # before the wiki (staging's worker was OOM-killed on 2026-09-24).
    mem_reservation: 512m
    oom_score_adj: -500
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  meshwiki-staging:
    # Deliberately its own fixed tag, not ${MESHWIKI_VERSION:-latest} — that
    # var is shared with the meshwiki (prod) service above via the same
    # /opt/meshwiki/.env docker-compose auto-loads, and prod's deploy job
    # pins it to a specific sha- tag after every deploy. Sharing it here
    # would make staging silently track whatever prod last deployed instead
    # of its own `staging`-tagged build. See PLAN.md M2, 2026-09-05.
    image: ghcr.io/jyrkihuhta/meshwiki:staging
    restart: unless-stopped
    volumes:
      - /opt/meshwiki/staging/src/meshwiki:/app/meshwiki:ro
      - /opt/meshwiki/data/staging-pages:/data/pages
    env_file: /opt/meshwiki/staging.env
    # The host runs other workloads and can run short of memory. Reserve
    # some and lower the OOM score so the kernel kills other processes
    # before the wiki (staging's worker was OOM-killed on 2026-09-24).
    mem_reservation: 512m
    oom_score_adj: -500
    expose:
      - "8000"
    command:
      - uvicorn
      - meshwiki.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/meshwiki
    healthcheck:
      # The --reload supervisor (PID 1) only starts a new worker when files
      # change. If the worker dies (OOM-killed on 2026-09-24), the port stays
      # open with nothing serving it, and Docker never restarts a container
      # just for being unhealthy. After 5 straight failures, stop PID 1 so
      # the container exits and restart: unless-stopped brings it back.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"
          && rm -f /tmp/hc_failures
          || { n=$$(( $$(cat /tmp/hc_failures 2>/dev/null || echo 0) + 1 ));
          echo $$n > /tmp/hc_failures; [ $$n -lt 5 ] || kill 1; exit 1; }
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  orchestrator:
    image: ghcr.io/jyrkihuhta/meshwiki-orchestrator:${ORCHESTRATOR_VERSION:-latest}
    restart: unless-stopped
    env_file: /opt/meshwiki/orchestrator.env
    volumes:
      - orchestrator_data:/data
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      meshwiki:
        condition: service_healthy

  orchestrator-staging:
    # Own fixed tag — see the same note on meshwiki-staging above.
    image: ghcr.io/jyrkihuhta/meshwiki-orchestrator:staging
    restart: unless-stopped
    env_file: /opt/meshwiki/orchestrator-staging.env
    volumes:
      - /opt/meshwiki/staging/orchestrator/factory:/app/factory:ro
      - orchestrator_staging_data:/data
    expose:
      - "8002"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      meshwiki-staging:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/meshwiki/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - meshwiki

volumes:
  caddy_data:
  caddy_config:
  orchestrator_data:
  orchestrator_staging_data:
