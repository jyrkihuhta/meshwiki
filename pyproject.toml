[project]
name = "meshwiki"
version = "0.1.0"
description = "A modern wiki platform inspired by MoinMoin, Graphingwiki, and Obsidian"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "itsdangerous>=2.1",
    "structlog>=24.0",
    "prometheus-client>=0.19",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
package-dir = {"" = "src"}
packages = ["meshwiki"]

[tool.hatch.build.targets.sdist]
include = ["src/meshwiki"]

[tool.isort]
profile = "black"
# isort is invoked only against Python files in CI; this exclude is defensive
# so that ad-hoc local runs over the whole repo (which can include Molly armory
# playbook .md files mounted in this checkout) skip them too.
skip_glob = ["**/*.md"]

[tool.black]
# Black skips *.md by default — declare it explicitly so reviewers running
# `black --check .` from the repo root don't see "Cannot parse: 1:3: ---"
# errors on playbook Markdown files.
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
| .*\.md
'''

[tool.ruff]
# Ruff skips *.md by default — declare it explicitly so reviewers running
# `ruff check .` from the repo root don't see "No Python files found" on
# playbook Markdown files.
exclude = ["*.md", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["meshwiki"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
